<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexor | Innovación Tecnológica</title>
    <meta name="description" content="Nexor: Soluciones tecnológicas innovadoras y desarrollo web avanzado.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header" id="main-header">
        <nav class="header__nav" aria-label="Navegación principal">
            
            <button class="header__menu-btn" aria-label="Abrir menú">
                <span class="header__menu-icon"></span>
            </button>

            <a href="#" class="header__logo-link" aria-label="Volver al inicio">
                <img src="ANIMACIONES/X-logo.png" alt="Logo de Nexor" class="header__logo-img">
            </a>

            <div class="header__spacer" aria-hidden="true"></div> 
        </nav>
    </header>

    <main class="main-content">
        <section class="hero" id="hero-section">
            <div class="hero__sticky-container">
                <canvas id="hero-canvas"></canvas>
                <h1 class="visually-hidden">Nexor - Innovación Tecnológica</h1>
            </div>
        </section>

        <section class="next-section">
            <div class="container">
                <h2>El futuro empieza acá</h2>
                <p>Acá irá el resto de tu contenido...</p>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
